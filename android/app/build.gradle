apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.breachsixgames.tacticalsquad'
    compileSdk 36

    defaultConfig {
        applicationId "com.breachsixgames.tacticalsquad"
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("SIGNING_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Ne signe avec la vraie clé que si les variables d'environnement
            // sont présentes (CI) ; sinon build non signée (dev local).
            if (System.getenv("SIGNING_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        debug {
            // Signature debug automatique standard d'Android — suffisante
            // pour les tests Firebase Test Lab avec les IDs de test AdMob.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
}
