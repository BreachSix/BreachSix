name: Build & test BreachSix Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Décoder le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/signing.keystore
            echo "SIGNING_KEYSTORE_PATH=$(pwd)/app/signing.keystore" >> "$GITHUB_ENV"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK debug (IDs de test AdMob — pour Firebase Test Lab)
        run: gradle assembleDebug

      - name: Build AAB release signé
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Publier l'APK debug (artefact de build)
        uses: actions/upload-artifact@v4
        with:
          name: breachsix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'AAB release (si signé)
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: breachsix-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  firebase-test-lab:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_FIREBASE_TEST_LAB == 'true' }}
    steps:
      - name: Récupérer l'APK debug construit à l'étape précédente
        uses: actions/download-artifact@v4
        with:
          name: breachsix-debug-apk
          path: apk

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Configurer gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Lancer le test sur Firebase Test Lab (Robo, appareil réel virtualisé)
        run: |
          gcloud firebase test android run \
            --type robo \
            --app apk/app-debug.apk \
            --device model=redfin,version=30,locale=fr,orientation=portrait \
            --timeout 5m
